target: BiModalRegressor
model_checkpoint: data/checkpoints/checkpoint.pth
plugins_checkpoint: null
breakpoints:
  - layer_name: head
    bp: 
      _target_: src.plugins.hook.Breakpoint
      name: reconstructor
      callback: 
        _target_: src.plugins.reconstructor.linear.BilinearReconstructor
        d_1: 16
        d_2: 16
        hidden_dim: 16
        activation: silu
        norm: batch
        dropout: 0.3
        order: adn
        concat: true
        dist: 
          _target_: torch.nn.MSELoss
          reduction: none
      mutate: true
      valid: true
    pos: before

# === EKF Experiment Configuration ===

# SD-setting input-shift covariance provider.
# Sigma_z(z) = (d_M^2(z; mu_A, Sigma_A) / d_z) * Sigma_A
# Fitted once at module init on n_source_samples drawn from x_range.
sigma_z:
  # sd | cycle | cycle_iso | gmm | pca
  # cycle_iso = Cycle+Identity: B-only SOTA (no source data needed)
  # cycle     = Cycle+SigmaA:  SD SOTA    (uses source_x_range samples)
  type: "cycle_iso"
  n_source_samples: 5000
  source_x_range: [-1.0, 1.0]
  cov_floor: 1.0e-4

ekf:
  jacobian_mode: "autograd"
  diagonal: true
  sigma_net_recon: 0.0
  sigma_net_pred: 0.0

nll:
  learn_calibration: true
  beta_init: 0.5
  eps: 1.0e-8

