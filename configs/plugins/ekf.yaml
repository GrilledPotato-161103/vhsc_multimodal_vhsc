target: BiModalRegressor
model_checkpoint: data/checkpoints/checkpoint_toy_model_v1.pth
plugins_checkpoint: null
breakpoints:
  - layer_name: head
    bp: 
      _target_: src.plugins.hook.Breakpoint
      name: reconstructor
      callback: 
        _target_: src.plugins.reconstructor.linear.BilinearReconstructor
        d_1: 16
        d_2: 16
        hidden_dim: 16
        activation: silu
        norm: group
        dropout: 0.3
        order: adn
        concat: true
        dist: 
          _target_: torch.nn.MSELoss
          reduction: none
      mutate: true
      valid: true
    pos: before

# === EKF Experiment Configuration ===

# SD-setting input-shift covariance provider.
# Sigma_z(z) = (d_M^2(z; mu_A, Sigma_A) / d_z) * Sigma_A
# Fitted once at module init on n_source_samples drawn from x_range.
sigma_z:
  type: "sd"
  n_source_samples: 1024              # ablation knob: shrink toward 0 -> SF/B-only regime
  source_x_range: [-1.0, 1.0]         # range used to draw source samples
  cov_floor: 1.0e-4

ekf:
  jacobian_mode: "autograd"
  diagonal: true
  sigma_net_recon: 0.0
  sigma_net_pred: 0.0

nll:
  learn_calibration: true
  beta_init: 0.5
  eps: 1.0e-8

