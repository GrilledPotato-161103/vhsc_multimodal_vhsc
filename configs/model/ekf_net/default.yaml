_target_: src.plugins.head.ekf.EKFBiModalInferer
_partial_: True

defaults:
  - aleatoric_net: default
  
latent_dim: 16
n_modals: 2
output_dim: 1
hidden_dims: [32, 16, 16, 16]
per_dim_uncertainty: true
activation: silu
norm: batch
dropout: 0.5
residual: true

# "learned" — two-head MLP pipeline (bounded: softplus inv_alpha, sigmoid-squashed beta).
#             Calibrated predictive variance; this is the real experiment pipeline.
# "closed_form" — alpha = sqrt(2 sigma_pred_sq), beta = 2 (formalism/02 §3).
#                  Diagnostic only: isolates the EKF chain (no learnable uncertainty params,
#                  variance is uninformative here because the latent shift is small).
# closed_form ties var = sigma_total directly (no inv_alpha_net indirection).
# Confirmed by cf1: jumped PCC(predvar,err) from ~0 to 0.87. This is the winner.
mode: "closed_form"

# Bounds for the learned beta head -> beta in [beta_min, beta_max]. Keeps
# Gamma(3/beta)/Gamma(1/beta) finite (a collapsing beta caused the variance blow-up).
beta_min: 0.5
beta_max: 4.0

# Propagation mode for sigma_pred_sq inside EKFBiModalInferer.forward.
# "first_order"  — J_g^T Sigma_recon J_g  (fast, suffers Jacobian collapse OOD)
# "second_order" — adds (1/2)tr((H_g Sigma_recon)^2) (d backward passes per batch,
#                  fixes Jacobian collapse; ~3-5x slower but calibrated OOD variance)
prop_mode: "second_order"

# ---------------------------------------------------------------------------
# Aleatoric uncertainty head: learns in-distribution function complexity.
# Combined with epistemic: sigma_total = sigma_ep + lambda_aleatoric * sigma_al
# ---------------------------------------------------------------------------