# @package _global_

defaults:
  - _self_
  - data: manifold_shared
  - model: stage1_shared_embedding
  - callbacks: default
  - logger: wandb
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - experiment: null
  - hparams_search: null
  - optional local: default
  - debug: null

# task name, determines output directory path
logger:
  wandb:
    project: "VISHC_Manifold_Shared"
    name: stage1_shared_${now:%Y-%m-%d}_${now:%H-%M-%S}
task_name: "train_stage1"

callbacks:
  model_checkpoint:
    monitor: "val/cont_best"
    mode: "min"
    save_last: True
    auto_insert_metric_name: False
  shared_embedding:
    _target_: src.utils.callbacks.shared_embedding_callback.SharedEmbeddingCallback
    tsne_perplexity: 30.0
    tsne_random_state: 42
    log_interval_epochs: 1
    n_tsne_samples: 1000

tags: ["stage1", "shared_embedding"]

# set False to skip model training
train: True
# Stage 1 does not evaluate regression
test: False

ckpt_path: null
seed: 42
