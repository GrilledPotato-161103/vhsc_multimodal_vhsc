_target_: src.data.manifold_datamodule.ManifoldDataModule

x_expressions:
  - "x[0] + 0.5*x[1] - 0.3*x[2] + 0.2*x[3]"
  - "-0.3*x[2] + 0.2*x[3] + 0.5*x[4] - 0.2*x[5]"
y_expression: "torch.linalg.norm(x, dim=0, keepdim=True)"
n_samples: 1280
batch_size: 16
num_workers: 12

val_ratio: 0.2
test_ratio: 0.1

# [0, 2pi]
z_range: [[-1., 1.1]]
z_dim: 8

z_src_range: [[-1., 1.]]
n_src_samples: 256

noise_std: 0.1
noise_ratio: 0.3
seed: 42