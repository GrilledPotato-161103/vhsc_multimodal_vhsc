_target_: src.data.manifold_datamodule.ManifoldDataModule

x_expressions:
  - "torch.cosh(x[1]) * torch.cos(x[0])"
  - "torch.cosh(x[1]) * torch.sin(x[0])"
y_expression: "x[1]"
n_samples: 1280
batch_size: 16
num_workers: 12

val_ratio: 0.2
test_ratio: 0.1

# [0, 2pi]
z_range: [2.0, 8.2831]
z_dim: 2

noise_std: 0.1
noise_ratio: 0.3
seed: 42