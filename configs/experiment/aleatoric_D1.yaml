# @package _global_
# Attempt D1: batch norm instead of layer norm in aleatoric head
defaults:
  - override /model/ekf_net: default
model:
  ekf_net:
    use_aleatoric: true
    aleatoric_hidden_dim: 32
    aleatoric_n_layers: 2
    aleatoric_norm: "batch"
    lambda_aleatoric: 1.0
logger:
  wandb:
    name: "aleatoric_D1_batchnorm_${now:%H-%M-%S}"
    tags: ["aleatoric", "D1", "batchnorm"]
