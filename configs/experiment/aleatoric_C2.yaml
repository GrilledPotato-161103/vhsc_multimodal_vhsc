# @package _global_
# Attempt C2: aleatoric head sees z + log_sigma_ep (default, canonical)
defaults:
  - override /model/ekf_net: default
model:
  ekf_net:
    use_aleatoric: true
    aleatoric_hidden_dim: 32
    aleatoric_n_layers: 2
    lambda_aleatoric: 1.0
logger:
  wandb:
    name: "aleatoric_C2_z_logsep_${now:%H-%M-%S}"
    tags: ["aleatoric", "C2", "z_logsep"]
