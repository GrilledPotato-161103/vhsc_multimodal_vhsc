# @package _global_
# Attempt C1: aleatoric head sees z only (no sigma_ep) — pure function complexity
defaults:
  - override /model/ekf_net: default
model:
  ekf_net:
    use_aleatoric: true
    aleatoric_hidden_dim: 32
    aleatoric_n_layers: 2
    lambda_aleatoric: 1.0
    aleatoric_input_mode: "z_only"
logger:
  wandb:
    name: "aleatoric_C1_zonly_${now:%H-%M-%S}"
    tags: ["aleatoric", "C1", "z_only"]
